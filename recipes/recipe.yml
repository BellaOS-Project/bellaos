---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Imagem publicada em ghcr.io/bellaos-project/bellaos
name: bellaos
description: BellaOS — imagem de teste (MVP)

# Base: Fedora Kinoite oficial (KDE Plasma, imutável) — o mesmo ponto de partida do Aurora.
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

# Módulos executados em ordem
modules:
  # Copia tudo de files/system/ para a raiz (/) da imagem
  - type: files
    files:
      - source: system
        destination: /

  # Pacotes do sistema (RPM). Por enquanto só o mínimo para provar que o build funciona.
  - type: dnf
    install:
      packages:
        - distrobox # base da "segunda home"

  # Flatpaks instalados para todos os usuários
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.usebottles.bottles
      - scope: user

  # Política de assinatura para a imagem assinada funcionar
  - type: signing
